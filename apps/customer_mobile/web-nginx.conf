server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Unversioned assets must not survive a deployment in an HTTP cache.
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    etag off;
    if_modified_since off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Must remain real JavaScript, never the SPA fallback.
    location = /flutter_service_worker.js {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /web-reset.html { try_files $uri =404; }
    location = /version.json { try_files $uri =404; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /canvaskit/ { try_files $uri =404; }
    location ~* \.(?:js|wasm|css|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|map)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
