name: shik-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: shik-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shik_menu
    ports:
      - "5432:5432"
    volumes:
      - shik_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shik-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shik_dev_redis:/data

volumes:
  shik_dev_pg:
  shik_dev_redis:
