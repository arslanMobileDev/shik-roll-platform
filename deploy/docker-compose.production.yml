# SHIK Platform — production-композиция для VPS Timeweb Cloud (РФ, 152-ФЗ).
# Данные PostgreSQL/Redis размещаются на сервере в РФ; порты БД и Redis
# НЕ публикуются наружу — доступ только внутри изолированной сети shik_network.
#
# Запуск/обновление:  ./deploy/scripts/deploy.sh
# Валидация:          docker compose -f deploy/docker-compose.production.yml config
name: shik-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: shik_postgres
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shik_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shik_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - shik_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.production
    image: shik-backend:production
    container_name: shik_backend
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shik_network
    # порт 3000 не публикуется на хост — трафик идёт только через nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: shik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx/.rendered/nginx.conf генерируется deploy.sh из nginx/nginx.conf
      # (подстановка DOMAIN из .env.production)
      - ./nginx/.rendered/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - shik_network

  # Опциональный сайдкар авто-продления Let's Encrypt:
  #   docker compose -f docker-compose.production.yml --profile certbot up -d certbot
  certbot:
    image: certbot/certbot:latest
    container_name: shik_certbot
    profiles: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;'

networks:
  shik_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
