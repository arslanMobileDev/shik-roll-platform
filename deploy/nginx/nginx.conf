# SHIK Platform — production Nginx (reverse proxy + SSL termination).
# Это ШАБЛОН: deploy/scripts/deploy.sh подставляет реальный домен вместо
# __DOMAIN__ и монтирует результат из deploy/nginx/.rendered/nginx.conf.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Лимит тела запроса — 20M (загрузка фото меню)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Корректный Upgrade для WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shik_backend {
        server backend:3000;
        keepalive 32;
    }

    upstream customer_web {
        server customer-web:80;
        keepalive 8;
    }

    upstream kds_web {
        server kds-web:80;
        keepalive 8;
    }

    # ---------- HTTP: ACME-challenge для Let's Encrypt + редирект на HTTPS ----------
    server {
        listen 80;
        server_name __DOMAIN__ api.__DOMAIN__ kds.__DOMAIN__;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS API: reverse proxy на NestJS ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name api.__DOMAIN__;

        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Authenticated Kitchen API SSE used by the production KDS.
        location = /kitchen/stream {
            proxy_pass http://shik_backend/kitchen/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /api/kitchen/stream {
            proxy_pass http://shik_backend/kitchen/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Public API prefix. The trailing slash strips /api before forwarding
        # because NestJS routes are registered at /orders, /payments, etc.
        location /api/ {
            proxy_pass http://shik_backend/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Kitchen SSE endpoint used by the current KDS client.
        location = /orders/kds/stream {
            proxy_pass http://shik_backend/orders/kds/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Same SSE stream through the public /api prefix.
        location = /api/orders/kds/stream {
            proxy_pass http://shik_backend/orders/kds/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Compatibility alias requested for kitchen event consumers.
        location = /orders/events {
            proxy_pass http://shik_backend/orders/kds/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # YooKassa callback. Only POST is accepted; the backend validates the
        # event against YooKassa API before changing the order status.
        location = /payments/webhook {
            limit_except POST { deny all; }
            proxy_pass http://shik_backend/payments/webhook;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Customer order tracking is also SSE and must not be buffered.
        location ~ ^/orders/[0-9a-fA-F-]+/tracking-stream$ {
            proxy_pass http://shik_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1h;
        }

        # Existing unprefixed API remains available for deployed Flutter
        # clients whose API_BASE_URL points directly at this host.
        location / {
            proxy_pass http://shik_backend;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Заголовки прокси
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ---------- Customer Flutter Web SPA ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name __DOMAIN__;
        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://customer_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------- Kitchen Flutter Web SPA ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name kds.__DOMAIN__;
        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://kds_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
