user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format shik '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log shik;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    map $http_origin $cors_origin {
        default '';
        "https://__DOMAIN__" $http_origin;
        "https://www.__DOMAIN__" $http_origin;
        "https://api.__DOMAIN__" $http_origin;
    }
    map $cors_origin $cors_credentials {
        default "true";
        '' '';
    }

    upstream shik_api {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name __DOMAIN__ www.__DOMAIN__ api.__DOMAIN__;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { 
            return 308 https://$host$request_uri; 
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name __DOMAIN__ www.__DOMAIN__ api.__DOMAIN__;

        ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Last-Event-ID, Idempotency-Key, X-Request-ID" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        add_header X-Accel-Buffering no always;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        location / {
            if ($request_method = OPTIONS) { return 204; }

            rewrite ^/api/(.*)$ /$1 break;
            rewrite ^/api$ / break;
            proxy_pass http://shik_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
            proxy_request_buffering on;
        }
    }
}
